# Render free tier: one Docker web service plus one managed Postgres. Both are ₹0.
services:
  - type: web
    name: wallet-service
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DB_POOL_SIZE
        value: "10"

databases:
  - name: wallet-db
    plan: free
    region: singapore
    databaseName: wallet
    user: wallet
