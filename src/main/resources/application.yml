spring:
  application:
    name: wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet}
    hikari:
      pool-name: wallet-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      # A decimal amount is a client bug, not something to silently truncate into paise.
      accept-float-as-int: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: wallet-service

app:
  admin-token: ${ADMIN_TOKEN:local-admin-token}
